name: Deploy to Cloudflare Workers

permissions:
  contents: read
  actions: read

on:
  workflow_run:
    workflows: ["Upstream Sync"]
    types:
      - completed
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新部署（跳过变更检查）'
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - id: decide
        name: 🔍 Determine if deploy is needed
        run: |
          EVENT_NAME="${{ github.event_name }}"
          WORKFLOW_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          FORCE="${{ inputs.force }}"
          CURR_SHA="${{ github.sha }}"

          echo "Event: $EVENT_NAME, Conclusion: $WORKFLOW_CONCLUSION, Force: $FORCE, Curr SHA: $CURR_SHA"

          SHOULD_DEPLOY="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手动触发，执行部署"
            SHOULD_DEPLOY="true"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "代码直接 Push 变更，执行部署"
            SHOULD_DEPLOY="true"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "Upstream Sync 执行未成功 ($WORKFLOW_CONCLUSION)，跳过部署"
            else
              PREV_SHA="$(gh run list --workflow=deploy.yml --status=success --limit 1 --json headSha -q '.[0].headSha' || true)"
              echo "上一次成功部署的 Commit SHA: $PREV_SHA"
              if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" != "$CURR_SHA" ] || [ "$FORCE" = "true" ]; then
                echo "检测到新提交 ($CURR_SHA)，执行部署"
                SHOULD_DEPLOY="true"
              else
                echo "代码无变动 ($CURR_SHA 已部署)，跳过重复部署"
              fi
            fi
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build frontend assets
        run: npm run build:frontend

      - name: 📝 Create wrangler.toml
        run: |
          cat > wrangler.toml << 'WEOF'
          name = "cf-server-monitor"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          # 定时任务配置（UTC）
          # - 每分钟：执行离线节点检测
          # - 每小时：合并执行其他定时任务（每月1号数据清理、每月8号清理旧表、每天12点服务器到期检测）
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]

          [assets]
          directory = "./dist"
          binding = "ASSETS"

          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "D1_PLACEHOLDER"

          # Durable Objects：实时指标广播中心
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]

          [vars]
          API_SECRET = "SECRET_PLACEHOLDER"
          API_USER_NAME = "USER_NAME_PLACEHOLDER"
          CORS_ALLOWED_ORIGINS = "CORS_ORIGINS_PLACEHOLDER"
          WEOF

          # 替换占位符（优先读取 Secrets，缺失时采用线上生产配置兜底）
          D1_ID="${{ secrets.D1_DATABASE_ID }}"
          D1_ID="${D1_ID:-ae7dc77f-f69a-4f11-aec6-35d7e1e3d480}"

          SECRET_VAL="${{ secrets.API_SECRET }}"
          SECRET_VAL="${SECRET_VAL:-62e81574028332ce01e70730c8ad4ab8}"

          USER_NAME="${{ secrets.API_USER_NAME }}"
          USER_NAME="${USER_NAME:-admin}"

          CORS_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}"
          CORS_ORIGINS="${CORS_ORIGINS:-*}"

          sed -i "s|D1_PLACEHOLDER|${D1_ID}|g" wrangler.toml
          sed -i "s|SECRET_PLACEHOLDER|${SECRET_VAL}|g" wrangler.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${USER_NAME}|g" wrangler.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${CORS_ORIGINS}|g" wrangler.toml

          echo "✅ wrangler.toml 已生成"

      # wrangler v4 的 `deploy` 会自动根据 wrangler.toml 中的 [[durable_objects.bindings]]
      # 声明创建 DO namespace（幂等：已存在则跳过），无需单独命令。
      # 前提：MetricsBroadcaster 类必须从 index.js 导出（已通过 src/index.js 实现）。
      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID || 'e32869c058369fe461c669fe0bfeeb79' }}
          wranglerVersion: '4'
          command: deploy

      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "============================================"
          echo "  🎉 部署成功！"
          echo "============================================"

      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "============================================"
          echo "  💥 部署失败！请检查 Actions 日志"
          echo "============================================"
